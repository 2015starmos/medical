<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>獸醫電子病歷系統 - 專業影像版</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- 引入 PDF.js 用於 PDF 轉圖片 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';</script>
  
  <style>
    :root{
      --primary:#2c5aa0; --secondary:#f9a825; --success:#2ecc71;
      --danger:#e74c3c; --info:#3498db; --gray-light:#f5f5f5;
      --gray:#ddd; --text:#333; --white:#fff;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft JhengHei", sans-serif;}
    body{background:#f0f2f5;color:var(--text);font-size:13px;line-height:1.4;}
    .header{background:linear-gradient(135deg, var(--primary), #1a3d7a); color:var(--white); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100;}
    .container{max-width:1600px; margin:15px auto; padding:0 10px;}
    .tab-header{display:flex; background:var(--gray-light); border:1px solid var(--gray); border-radius:6px 6px 0 0;}
    .tab-btn{padding:12px 20px; border:none; background:transparent; cursor:pointer; font-weight:bold; border-right:1px solid var(--gray);}
    .tab-btn.active{background:var(--primary); color:var(--white);}
    .tab-content{background:var(--white); border:1px solid var(--gray); border-top:none; padding:20px; border-radius:0 0 6px 6px;}
    .page{display:none;} .page.active{display:block;}
    .section{border:1px solid var(--gray); border-radius:6px; margin-bottom:20px; overflow:hidden;}
    .section-header{padding:10px 15px; background:#f8f9fa; border-bottom:1px solid var(--gray); font-weight:bold; color:var(--primary); display:flex; justify-content:space-between;}
    .section-body{padding:15px;}
    .form-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:15px;}
    input, select, textarea{width:100%; padding:8px; border:1px solid var(--gray); border-radius:4px;}
    .btn{padding:8px 16px; border-radius:4px; border:none; cursor:pointer; font-weight:bold; display:inline-flex; align-items:center; gap:5px;}
    .btn-primary{background:var(--primary); color:white;}
    .btn-success{background:var(--success); color:white;}
    .btn-danger{background:var(--danger); color:white;}
    .btn-outline{background:transparent; border:1px solid var(--primary); color:var(--primary);}
    
    /* 照片排序樣式 */
    .photo-grid{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px;}
    .photo-item{width:140px; background:#fff; border:1px solid var(--gray); padding:5px; border-radius:4px; position:relative;}
    .photo-item img{width:100%; height:120px; object-fit:cover; cursor:pointer; border-radius:2px;}
    .sort-controls{display:flex; justify-content:space-between; margin-top:5px; gap:2px;}
    .sort-btn{flex:1; padding:3px; font-size:10px; background:#eee; border:1px solid #ccc; cursor:pointer; border-radius:2px;}
    .sort-btn:hover{background:var(--primary); color:white;}

    /* 燈箱樣式 */
    .modal{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:none; z-index:9999; align-items:center; justify-content:center;}
    .modal-content{position:relative; max-width:90%; max-height:90%;}
    .modal-img{max-width:100%; max-height:85vh; border:3px solid white;}
    .modal-nav{position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.2); color:white; border:none; font-size:40px; padding:20px; cursor:pointer; border-radius:50%;}
    .modal-nav:hover{background:rgba(255,255,255,0.4);}
    .modal-prev{left:-80px;} .modal-next{right:-80px;}
    
    .data-table{width:100%; border-collapse:collapse;}
    .data-table th, .data-table td{padding:10px; border:1px solid var(--gray); text-align:left;}
  </style>
</head>
<body>

<div class="header">
  <h2>獸醫電子病歷系統</h2>
  <button class="btn btn-primary" onclick="adminLogin()">🔐 管理登入</button>
</div>

<div class="container">
  <div class="tab-header">
    <button class="tab-btn active" onclick="switchTab('cat', this)">🐱 動物基本資料</button>
    <button class="tab-btn" onclick="switchTab('record', this)">📝 建立病歷紀錄</button>
    <button class="tab-btn" onclick="switchTab('history', this)">🔍 病歷查詢</button>
  </div>

  <div class="tab-content">
    <!-- 動物資料 -->
    <div id="cat" class="page active">
      <div class="section">
        <div class="section-header"><span>編輯動物資料</span><button class="btn btn-outline" onclick="clearCatForm()">清空</button></div>
        <div class="section-body">
          <input type="hidden" id="editCatId">
          <div class="form-grid">
            <div><label>動物姓名</label><input type="text" id="catName"></div>
            <div><label>晶片號碼</label><input type="text" id="chipId"></div>
            <div><label>飼主姓名</label><input type="text" id="ownerName"></div>
            <div><label>手機</label><input type="text" id="ownerPhone"></div>
            <div><label>居住地址</label><input type="text" id="ownerAddr"></div>
          </div>
          <button class="btn btn-primary" onclick="saveCatData()">💾 儲存資料</button>
        </div>
      </div>
      <div class="section">
        <div class="section-body">
          <input type="text" placeholder="搜尋動物..." oninput="searchCatAll(this.value)">
          <table class="data-table" style="margin-top:10px;">
            <thead><tr><th>姓名</th><th>飼主</th><th>操作</th></tr></thead>
            <tbody id="catTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 建立病歷 -->
    <div id="record" class="page">
      <div id="recordIdBar"></div>
      <div class="section">
        <div class="section-header">1. 綁定動物</div>
        <div class="section-body">
          <input type="text" placeholder="搜尋貓名/手機/晶片..." oninput="searchCatForRecord(this.value)">
          <div id="bindCatInfo" style="margin-top:10px; padding:10px; border:1px dashed #ccc;">請先選擇動物</div>
        </div>
      </div>
      <div class="section">
        <div class="section-header">2. 診斷與影像</div>
        <div class="section-body">
          <div class="form-grid">
            <div><label>就診日期</label><input type="date" id="visitDate"></div>
            <div><label>體重 (kg)</label><input type="number" id="nowWeight" step="0.01"></div>
          </div>
          <textarea id="visitContent" rows="4" placeholder="診斷內容..."></textarea>
          
          <div style="margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
            <label><b>📷 上傳檢驗照片 / PDF (自動轉圖)</b></label>
            <input type="file" id="examUpload" accept="image/*,application/pdf" multiple onchange="handleFileUpload(this)" style="margin-top:5px;">
            <div id="examPhotoGrid" class="photo-grid"></div>
          </div>
        </div>
      </div>
      <button class="btn btn-success" style="width:100%; padding:15px;" onclick="saveFullRecord()">📋 儲存病歷紀錄</button>
    </div>

    <!-- 病歷查詢 -->
    <div id="history" class="page">
      <div class="section">
        <div class="section-body">
          <div class="form-grid">
            <input type="text" id="filterKey" placeholder="關鍵字搜尋(姓名/手機/地址/晶片)...">
            <button class="btn btn-primary" onclick="searchHistoryRecord()">🔍 查詢</button>
          </div>
          <table class="data-table">
            <thead><tr><th>日期</th><th>動物</th><th>摘要</th><th>操作</th></tr></thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 燈箱播放器 -->
<div class="modal" id="imgModal">
  <div class="modal-content">
    <button class="modal-nav modal-prev" onclick="changeModalImg(-1)">❮</button>
    <img id="showBigImg" class="modal-img">
    <button class="modal-nav modal-next" onclick="changeModalImg(1)">❯</button>
  </div>
  <button style="position:absolute; top:30px; right:30px; color:white; font-size:30px; background:none; border:none; cursor:pointer;" onclick="closeImgModal()">✕</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB2yEi76WZfALxNkInhG5oG_0LMlNqDgH0",
    authDomain: "nibo-medical.firebaseapp.com",
    projectId: "nibo-medical",
    storageBucket: "nibo-medical.firebasestorage.app",
    messagingSenderId: "832769973754",
    appId: "1:832769973754:web:9e7782b36bfc89d02a5843"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.db = db; window.collection = collection; window.addDoc = addDoc;
  window.getDocs = getDocs; window.doc = doc; window.updateDoc = updateDoc;
  window.deleteDoc = deleteDoc; window.getDoc = getDoc;
</script>

<script>
  let currentCatId = null;
  let currentRecordId = "";
  let editRecordId = null;
  let currentExamPhotos = []; // 儲存 Base64 圖片陣列
  let currentModalIdx = 0;

  function switchTab(id, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  // --- 圖片處理與排序 ---
  async function handleFileUpload(input) {
    const files = Array.from(input.files);
    for (const file of files) {
      if (file.type === "application/pdf") {
        const dataUrl = await convertPdfToJpg(file);
        currentExamPhotos.push(dataUrl);
      } else {
        const dataUrl = await readFileAsDataURL(file);
        currentExamPhotos.push(dataUrl);
      }
    }
    renderPhotoGrid();
    input.value = "";
  }

  function readFileAsDataURL(file) {
    return new Promise((res) => {
      const reader = new FileReader();
      reader.onload = (e) => res(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  async function convertPdfToJpg(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
    const page = await pdf.getPage(1); // 抓第一頁
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;
    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    return canvas.toDataURL('image/jpeg');
  }

  function renderPhotoGrid() {
    const grid = document.getElementById('examPhotoGrid');
    grid.innerHTML = "";
    currentExamPhotos.forEach((src, idx) => {
      const div = document.createElement('div');
      div.className = 'photo-item';
      div.innerHTML = `
        <img src="${src}" onclick="openImgLightbox(${idx})">
        <div class="sort-controls">
          <button class="sort-btn" onclick="movePhoto(${idx}, -1)">◀</button>
          <button class="sort-btn" onclick="removePhoto(${idx})">🗑️</button>
          <button class="sort-btn" onclick="movePhoto(${idx}, 1)">▶</button>
        </div>
      `;
      grid.appendChild(div);
    });
  }

  function movePhoto(idx, dir) {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= currentExamPhotos.length) return;
    [currentExamPhotos[idx], currentExamPhotos[newIdx]] = [currentExamPhotos[newIdx], currentExamPhotos[idx]];
    renderPhotoGrid();
  }

  function removePhoto(idx) {
    if(confirm("移除此照片？")) { currentExamPhotos.splice(idx, 1); renderPhotoGrid(); }
  }

  // --- 燈箱控制 (手動切換) ---
  function openImgLightbox(idx) {
    currentModalIdx = idx;
    document.getElementById('showBigImg').src = currentExamPhotos[idx];
    document.getElementById('imgModal').style.display = 'flex';
  }

  function changeModalImg(dir) {
    currentModalIdx = (currentModalIdx + dir + currentExamPhotos.length) % currentExamPhotos.length;
    document.getElementById('showBigImg').src = currentExamPhotos[currentModalIdx];
  }

  function closeImgModal() { document.getElementById('imgModal').style.display = 'none'; }

  // --- 資料庫操作 ---
  async function saveCatData() {
    const id = document.getElementById('editCatId').value;
    const data = {
      name: document.getElementById('catName').value,
      chip: document.getElementById('chipId').value,
      owner: document.getElementById('ownerName').value,
      phone: document.getElementById('ownerPhone').value,
      addr: document.getElementById('ownerAddr').value
    };
    try {
      if(id) await updateDoc(doc(db, 'cats', id), data);
      else await addDoc(collection(db, 'cats'), data);
      alert("儲存成功");
      clearCatForm();
    } catch(e) { alert(e.message); }
  }

  async function bindCat(id, name) {
    currentCatId = id;
    currentRecordId = "DC" + Date.now().toString().slice(-8);
    document.getElementById('bindCatInfo').innerHTML = `<b style="color:green;">✅ 已綁定：${name}</b>`;
  }

  async function saveFullRecord() {
    if(!currentCatId) return alert("請選擇動物");
    const data = {
      recordId: currentRecordId,
      catId: currentCatId,
      visitDate: document.getElementById('visitDate').value || new Date().toISOString().split('T')[0],
      weight: document.getElementById('nowWeight').value,
      content: document.getElementById('visitContent').value,
      examPhotos: currentExamPhotos, // 儲存排序後的陣列
      updateTime: new Date().toISOString()
    };
    try {
      if(editRecordId) await updateDoc(doc(db, 'records', editRecordId), data);
      else await addDoc(collection(db, 'records'), data);
      alert("病歷已儲存");
      location.reload();
    } catch(e) { alert(e.message); }
  }

  async function searchHistoryRecord() {
    const key = document.getElementById('filterKey').value.toLowerCase();
    const catSnap = await getDocs(collection(db, 'cats'));
    const matchedCatIds = catSnap.docs.map(d => ({id:d.id, ...d.data()}))
      .filter(c => c.name.includes(key) || c.phone.includes(key) || (c.addr||"").includes(key))
      .map(c => c.id);

    const recSnap = await getDocs(collection(db, 'records'));
    const filtered = recSnap.docs.map(d => ({id:d.id, ...d.data()}))
      .filter(r => matchedCatIds.includes(r.catId))
      .sort((a,b) => new Date(b.visitDate) - new Date(a.visitDate));

    const tbody = document.getElementById('historyTableBody');
    tbody.innerHTML = filtered.map(r => `
      <tr>
        <td>${r.visitDate}</td>
        <td>${r.recordId}</td>
        <td>${r.content.slice(0,20)}...</td>
        <td><button class="btn btn-primary" onclick="editRecord('${r.id}')">✏️ 編輯</button></td>
      </tr>
    `).join('');
  }

  async function editRecord(id) {
    const snap = await getDoc(doc(db, 'records', id));
    const r = snap.data();
    editRecordId = id;
    currentRecordId = r.recordId;
    currentCatId = r.catId;
    currentExamPhotos = r.examPhotos || [];
    
    switchTab('record', document.querySelectorAll('.tab-btn')[1]);
    document.getElementById('visitDate').value = r.visitDate;
    document.getElementById('nowWeight').value = r.weight;
    document.getElementById('visitContent').value = r.content;
    renderPhotoGrid();
  }

  window.onload = () => { document.getElementById('visitDate').value = new Date().toISOString().split('T')[0]; };
</script>
</body>
</html>
